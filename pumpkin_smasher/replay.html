<style>
/* colors and fonts: the same as the ECHO Botz game pages */
:root{
  --bg:#04060E; --panel:rgba(8,12,28,.72); --ink:#F2F6FF; --muted:#8FA3C8;
  --cyan:#22E4F5; --pink:#FF2D9B; --line:rgba(34,228,245,.28); --off:#141B33; --err:#FF7AB8;
  --gold:#FFC93C;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth; -webkit-text-size-adjust:100%; background:var(--bg)}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
  font-family:"Chakra Petch",system-ui,-apple-system,"Segoe UI",sans-serif; line-height:1.5;
  overflow-x:hidden;
}
img{max-width:100%; display:block}
a{color:inherit}

/* background layers (same as the game pages) */
.grid{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:
    linear-gradient(rgba(34,228,245,.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(34,228,245,.06) 1px, transparent 1px);
  background-size:48px 48px;
  mask-image:radial-gradient(ellipse at 50% 40%, #000 30%, transparent 85%);
  -webkit-mask-image:radial-gradient(ellipse at 50% 40%, #000 30%, transparent 85%);
}
#net{position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none}
#critters{position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none}
#bots{position:fixed; inset:0; z-index:1; pointer-events:none; overflow:hidden}
#net{position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none}
#bots{position:fixed; inset:0; z-index:1; pointer-events:none; overflow:hidden}
main, footer{position:relative; z-index:2}

.skip{position:absolute; left:1rem; top:-4rem; z-index:10; padding:.6rem 1rem; border-radius:10px;
  background:var(--cyan); color:#04060E; font-weight:700; text-decoration:none}
.skip:focus{top:calc(1rem + env(safe-area-inset-top, 0px))}
:focus-visible{outline:2px solid var(--pink); outline-offset:3px}

.wrap{width:min(1120px, 100% - 2.5rem); margin-inline:auto}

/* neon panels: the game pages' console panel with its pink to cyan outline */
.console{
  background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:1.25rem;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  box-shadow:0 0 0 1px rgba(255,45,155,.12), 0 20px 60px rgba(0,0,0,.5);
}
.console, .chat, .spotify, .x-link{
  position:relative; border-color:transparent !important;
  box-shadow:0 0 30px rgba(255,45,155,.3), 0 0 60px rgba(34,228,245,.18);
}
.console::before, .chat::before, .spotify::before, .x-link::before{
  content:""; position:absolute; inset:-1px; padding:3px; border-radius:inherit; pointer-events:none; z-index:1;
  background:linear-gradient(135deg, rgba(255,45,155,.9), rgba(34,228,245,.9));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
}

/* hero */
.hero{min-height:92vh; min-height:92svh; display:grid; place-items:center; text-align:center;
  padding:calc(4rem + env(safe-area-inset-top, 0px)) 0 4rem}
.visor{width:112px; height:52px; margin:0 auto 2rem; border-radius:26px; display:flex; align-items:center; justify-content:center; gap:22px;
  background:rgba(2,4,12,.7); border:1px solid var(--line); box-shadow:inset 0 0 18px rgba(34,228,245,.12), 0 0 14px rgba(255,45,155,.15)}
.visor span{width:16px; height:16px; border-radius:50%; background:var(--cyan); animation:eye 4s ease-in-out infinite}
@keyframes eye{0%,100%{opacity:.65; box-shadow:0 0 8px var(--cyan), 0 0 16px rgba(34,228,245,.5)} 50%{opacity:1; box-shadow:0 0 14px var(--cyan), 0 0 34px rgba(34,228,245,.85)}}
/* title: the same split pink and cyan glow as the ECHO BOTZ MINT heading */
.hero h1{margin:0; font-weight:700; letter-spacing:.12em; font-size:clamp(3rem,13vw,7rem); line-height:1.05; color:#fff;
  text-shadow:-2px 0 rgba(255,45,155,.85), 2px 0 rgba(34,228,245,.85), 0 0 18px rgba(255,45,155,.55)}
.tagline{margin:1.25rem auto 0; max-width:34rem; color:var(--muted); font-size:clamp(1.05rem,3.6vw,1.25rem)}
.mint-wrap{display:block; margin-top:2.25rem}
.mint-note{display:block; margin-top:1rem; font-family:"JetBrains Mono",ui-monospace,monospace; font-size:.8rem; color:var(--muted)}

/* Mint ECHO Botz button: the same button, gold LIVE look and animation as the game pages */
.mcp-btn{display:inline-flex; align-items:center; gap:.5rem; margin-top:1.1rem; padding:.6rem 1.5rem; border-radius:999px; text-decoration:none;
  font-weight:700; font-size:1rem; letter-spacing:.04em; color:#fff; background:rgba(4,6,14,.88); border:1.5px solid var(--pink);
  box-shadow:0 0 14px rgba(255,45,155,.35), 0 0 28px rgba(34,228,245,.15); transition:box-shadow .2s}
.mcp-btn:hover{box-shadow:0 0 22px rgba(255,45,155,.55), 0 0 40px rgba(34,228,245,.3)}
.mcp-btn:focus-visible{outline:2px solid var(--cyan); outline-offset:3px}
.mcp.mcp-live .mcp-btn{margin-top:.8rem; border-color:#FFC93C; box-shadow:0 0 14px rgba(255,201,60,.35)}
/* Mint ECHO Botz button (Mint is LIVE card): a calm breathe plus a gold light that travels around the outline */
@property --mcpA{syntax:'<angle>'; initial-value:0deg; inherits:false}
.mcp.mcp-live .mcp-btn{position:relative; animation:mcpBreathe 3s ease-in-out infinite; will-change:transform}
@keyframes mcpBreathe{
  0%,100%{transform:scale(1); box-shadow:0 0 14px rgba(255,201,60,.35)}
  50%{transform:scale(1.04); box-shadow:0 0 24px rgba(255,201,60,.6), 0 0 46px rgba(255,201,60,.25)}
}
@supports ((mask-composite:exclude) or (-webkit-mask-composite:xor)){
  .mcp.mcp-live .mcp-btn{border-color:transparent}
  .mcp.mcp-live .mcp-btn::before{
    content:""; position:absolute; inset:-1.5px; padding:1.5px; border-radius:inherit; pointer-events:none;
    background:conic-gradient(from var(--mcpA,0deg), #FFC93C 0deg, #FFC93C 150deg, #FF8A1E 220deg, #FFF4C8 270deg, #FF8A1E 310deg, #FFC93C 360deg);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
    animation:mcpSpin 6s linear infinite;
  }
}
@keyframes mcpSpin{to{--mcpA:360deg}}
@media (prefers-reduced-motion: reduce){.mcp.mcp-live .mcp-btn,.mcp.mcp-live .mcp-btn::before{animation:none}}

/* section headings: the game title style */
section{padding:3.5rem 0}
.section-title{margin:0 0 .5rem; font-size:clamp(1.7rem,6vw,2.4rem); font-weight:700; letter-spacing:.02em; line-height:1.15;
  text-shadow:-2px 0 rgba(255,45,155,.75),2px 0 rgba(34,228,245,.75)}
.section-sub{margin:0 0 2rem; color:var(--muted); max-width:52ch}

/* buttons: the game pages' main gradient button */
.gh-btn{width:100%;font:inherit;font-weight:700;font-size:1rem;color:#04060E;cursor:pointer;border:0;border-radius:10px;padding:.65rem 1rem;background:linear-gradient(90deg,var(--pink),var(--cyan));box-shadow:0 0 18px rgba(255,45,155,.35)}
.gh-btn:hover{filter:brightness(1.1)}
.gh-btn:disabled{opacity:.55;cursor:progress}
.gh-btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
a.gh-btn{display:inline-flex; align-items:center; justify-content:center; gap:.5rem; text-decoration:none}
.gh-btn svg{width:14px; height:14px; fill:currentColor}

/* featured game */
.featured{display:grid; padding:0; overflow:hidden}
.featured-media{position:relative; aspect-ratio:1200 / 630; background:#0A1022}
.featured-media img{width:100%; height:100%; object-fit:cover}
.featured-body{padding:1.75rem 1.5rem 2rem}
.badge{display:inline-block; font-size:.75rem; font-weight:600; padding:3px 10px; border-radius:999px; border:1px solid var(--line); background:rgba(2,4,12,.7); color:var(--ink)}
.featured h2{margin:.9rem 0 .6rem; font-size:clamp(2rem,8vw,3.2rem); line-height:1.05; letter-spacing:.02em; text-shadow:-2px 0 rgba(255,45,155,.75),2px 0 rgba(34,228,245,.75)}
.featured p{margin:0 0 1.6rem; color:var(--muted); max-width:42ch}
.featured .gh-btn{width:auto; padding:.75rem 2rem; font-size:1.1rem}
/* Play buttons: the same gold light that travels around the Mint ECHO Botz outline */
#game-grid .gh-btn, #featured .gh-btn{position:relative}
@supports ((mask-composite:exclude) or (-webkit-mask-composite:xor)){
  #game-grid .gh-btn::before, #featured .gh-btn::before{
    content:""; position:absolute; inset:-1.5px; padding:1.5px; border-radius:inherit; pointer-events:none;
    background:conic-gradient(from var(--mcpA,0deg), #FFC93C 0deg, #FFC93C 150deg, #FF8A1E 220deg, #FFF4C8 270deg, #FF8A1E 310deg, #FFC93C 360deg);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
    animation:mcpSpin 6s linear infinite;
  }
}
@media (prefers-reduced-motion: reduce){#game-grid .gh-btn::before, #featured .gh-btn::before{animation:none}}
/* card animations: a small calm loop in the empty space under each card logo */
.card-fx{position:absolute; left:50%; bottom:7.5%; width:30%; height:14%; transform:translateX(-50%); pointer-events:none}
.fx-bb{display:flex; align-items:flex-end; justify-content:space-between; filter:drop-shadow(0 0 3px rgba(182,124,255,.35))}
.fx-bb::after{content:""; position:absolute; left:-4%; right:-4%; bottom:-7%; height:1px; border-radius:1px; opacity:.45;
  background:linear-gradient(90deg, transparent, #FF2D9B 12%, #FF8A2B, #FFC93C, #4DFF6A, #22E4F5, #7FA8FF, #B67CFF 88%, transparent)}
.fx-bb i{display:block; width:3.4%; height:100%; border-radius:2px; transform-origin:50% 100%; transform:scaleY(var(--lo));
  background:linear-gradient(90deg, #FF2D9B, #FF8A2B, #FFC93C, #4DFF6A, #22E4F5, #7FA8FF, #B67CFF); background-size:2940% 100%; background-position:var(--x) 0;
  animation:bbEq var(--d) cubic-bezier(.45,0,.55,1) var(--dl) infinite alternate; will-change:transform}
@keyframes bbEq{0%{transform:scaleY(var(--lo))} 100%{transform:scaleY(var(--hi))}}
.fx-off *{animation-play-state:paused}
/* Beat Breakerz: the live slider from its page logo, drawn in the logo's own units over the card image.
   Each dot slides to the ring and lands dead center on the beat (every 1.55s), the ring and the dot pulse together. */
.card-slider{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible}
.cbb-n{transform-box:fill-box; transform-origin:center; opacity:0; animation:cbbSlide 6.2s linear infinite; animation-delay:var(--d)}
@keyframes cbbSlide{0%{transform:translateX(0) scale(1); opacity:0; animation-timing-function:linear}6%{opacity:1}75%{transform:translateX(420px) scale(1); opacity:1; animation-timing-function:cubic-bezier(.2,.6,.35,1)}87%,100%{transform:translateX(420px) scale(1.55); opacity:0}}
.cbb-hit{transform-box:fill-box; transform-origin:center; animation:cbbHit 1.55s linear infinite}
@keyframes cbbHit{0%{transform:scale(1.3); stroke-opacity:1; animation-timing-function:cubic-bezier(.2,.6,.35,1)}40%{transform:scale(1); stroke-opacity:.5}88%{transform:scale(1); stroke-opacity:.5; animation-timing-function:cubic-bezier(.55,0,.8,.4)}100%{transform:scale(1.3); stroke-opacity:1}}
@media (prefers-reduced-motion: reduce){.cbb-n,.cbb-hit{animation:none}.cbb-n{opacity:1; transform:translateX(var(--st))}}
@media (prefers-reduced-motion: reduce){.fx-bb i{animation:none; transform:scaleY(var(--st))}}

/* Glitch Hunt: the logo stays still, like the game page. Under it, two small scan frames like the game board:
   a soft scan line passes down both and each difference gets ringed (cyan, then pink), like a find in the game. 8 s loop. */
.cgh-scan{opacity:0; animation:cghScan 8s linear infinite}
@keyframes cghScan{0%,7.5%{transform:translateY(0); opacity:0}9%{opacity:.6}27.5%{transform:translateY(68px); opacity:.6}29%{transform:translateY(68px); opacity:0}29.1%,57.5%{transform:translateY(0); opacity:0}59%{opacity:.6}77.5%{transform:translateY(68px); opacity:.6}79%,100%{transform:translateY(68px); opacity:0}}
.cgh-r{transform-box:fill-box; transform-origin:center; opacity:0; animation:8s cubic-bezier(.2,.7,.3,1) infinite}
.cgh-r1{animation-name:cghR1}
.cgh-r2{animation-name:cghR2}
@keyframes cghR1{0%,14.5%{opacity:0; transform:scale(1.5)}17%,43%{opacity:1; transform:scale(1)}48%,100%{opacity:0; transform:scale(1)}}
@keyframes cghR2{0%,69.3%{opacity:0; transform:scale(1.5)}71.8%,93%{opacity:1; transform:scale(1)}98%,100%{opacity:0; transform:scale(1)}}
@media (prefers-reduced-motion: reduce){.cgh-scan,.cgh-r{animation:none}.cgh-r{opacity:1}}
/* Memory Protocol: its page logo drawn live (letter wave, flipping cards, robot blink, the row of cells lighting in pairs),
   plus the game's four symbols playing back a sequence at the game's own pace. */
.cmp-z{transform-box:fill-box; transform-origin:50% 70%; animation:cmpZoom 6.2s ease-in-out infinite; animation-delay:calc(var(--i) * 70ms)}
@keyframes cmpZoom{0%,68%,100%{transform:none; fill:#F2F6FF}76%{transform:scale(1.28) translateY(-2px); fill:#FFFFFF; stroke:#22E4F5}84%{transform:none; fill:#F2F6FF}}
.cmp-flip{transform-box:fill-box; transform-origin:center; animation:cmpFlip 9.3s ease-in-out infinite; animation-delay:var(--d)}
@keyframes cmpFlip{0%,82%,100%{transform:scaleX(1)}87%{transform:scaleX(.03)}92%{transform:scaleX(1)}}
.cmp-eye{transform-box:fill-box; transform-origin:center; animation:cmpBlink 5s ease-in-out infinite}
@keyframes cmpBlink{0%,92%,100%{transform:none}95%{transform:scaleY(.15)}}
.cmp-c{animation:cmpCell 8s ease-in-out infinite; animation-delay:var(--d)}
@keyframes cmpCell{0%,16%,100%{fill:#1a0730; stroke:#B67CFF}5%,11%{fill:#22E4F5; stroke:#F2F6FF; fill-opacity:.55}}
.cmp-s{transform-box:fill-box; transform-origin:center; opacity:0; animation:8s linear infinite}
@keyframes cmpS0{0%{opacity:0;transform:scale(1)}18.00%{opacity:0;transform:scale(1)}19.00%,25.50%{opacity:1;transform:scale(1.12)}27.00%{opacity:0;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
.cmp-s0{animation-name:cmpS0}
@keyframes cmpS1{0%{opacity:0;transform:scale(1)}27.25%{opacity:0;transform:scale(1)}28.25%,34.75%{opacity:1;transform:scale(1.12)}36.25%{opacity:0;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
.cmp-s1{animation-name:cmpS1}
@keyframes cmpS2{0%{opacity:0;transform:scale(1)}8.75%{opacity:0;transform:scale(1)}9.75%,16.25%{opacity:1;transform:scale(1.12)}17.75%{opacity:0;transform:scale(1)}36.50%{opacity:0;transform:scale(1)}37.50%,44.00%{opacity:1;transform:scale(1.12)}45.50%{opacity:0;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
.cmp-s2{animation-name:cmpS2}
@keyframes cmpS3{0%{opacity:0;transform:scale(1)}45.75%{opacity:0;transform:scale(1)}46.75%,53.25%{opacity:1;transform:scale(1.12)}54.75%{opacity:0;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
.cmp-s3{animation-name:cmpS3}
@media (prefers-reduced-motion: reduce){.cmp-z,.cmp-flip,.cmp-eye,.cmp-c,.cmp-s{animation:none}}

.card-bl text{font-size:24px}
.cbl-1{fill:#4DFF6A; filter:url(#cblGlow)}

/* Pumpkin Smasher: like the game, pumpkins pop up from three holes and get smashed in turn: a squash, a small burst, shell halves, stem and seeds fly, then the hole is ready again. One smash every 2.7 s, 8 s loop.

@media (prefers-reduced-motion: reduce){.card-ps *{animation:none!important}}

/* games grid */
.games-grid{list-style:none; margin:0; padding:0; display:grid; gap:1.25rem; grid-template-columns:repeat(auto-fill, minmax(min(100%, 280px), 1fr))}
.card{display:flex; flex-direction:column; height:100%; padding:0; overflow:hidden; transition:transform .6s ease, box-shadow .6s ease}
.card:hover, .card:focus-within{transform:translateY(-4px); box-shadow:0 0 36px rgba(255,45,155,.45), 0 0 70px rgba(34,228,245,.3)}
.thumb{position:relative; aspect-ratio:1200 / 630; background:#0A1022; border-bottom:1px solid var(--line)}
.thumb img{width:100%; height:100%; object-fit:cover}
.placeholder{display:none; position:absolute; inset:0; place-items:center; padding:1rem; text-align:center;
  font-weight:700; font-size:clamp(1.3rem,5vw,1.7rem); color:#fff; text-shadow:-2px 0 rgba(255,45,155,.75),2px 0 rgba(34,228,245,.75);
  background:linear-gradient(rgba(34,228,245,.06) 1px, transparent 1px) 0 0 / 100% 8px, #0A1022}
.noimg img{display:none}
.noimg .placeholder{display:grid}
.card-body{display:flex; flex-direction:column; flex:1; padding:1.2rem 1.25rem 1.4rem}
.card h3{margin:0 0 .35rem; font-size:1.4rem; font-weight:700; line-height:1.2}
.card p{flex:1; margin:0 0 1.25rem; color:var(--muted); font-size:.97rem}

/* footer */
footer{margin-top:2rem; padding:2.5rem 0 3rem; border-top:1px solid var(--line); color:var(--muted); font-size:.88rem}
.foot{display:flex; flex-wrap:wrap; gap:1.25rem 2rem; align-items:center; justify-content:space-between}
.foot-brand{font-weight:700; font-size:1.25rem; color:var(--ink); letter-spacing:.02em; text-shadow:-2px 0 rgba(255,45,155,.75),2px 0 rgba(34,228,245,.75)}
.socials{display:flex; flex-wrap:wrap; gap:.75rem; list-style:none; margin:0; padding:0}
/* X links: the same neon pill links as the top of the game pages */
.tl{
  position:relative; display:flex; align-items:center; gap:.5rem; padding:.45rem .9rem .45rem .7rem;
  border-radius:999px; text-decoration:none; color:var(--ink); font-size:.85rem; font-weight:600;
  background:rgba(4,6,14,.88); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  box-shadow:0 0 18px rgba(255,45,155,.25), 0 0 36px rgba(34,228,245,.12); transition:box-shadow .2s;
}
.tl::before{
  content:""; position:absolute; inset:0; padding:2px; border-radius:inherit; pointer-events:none;
  background:linear-gradient(135deg, rgba(255,45,155,.9), rgba(34,228,245,.9));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
}
.tl svg{width:16px; height:16px; flex:none}
.tl:hover{box-shadow:0 0 26px rgba(255,45,155,.45), 0 0 50px rgba(34,228,245,.25)}
.tl:focus-visible{outline:2px solid var(--pink); outline-offset:3px}
.copy{width:100%; margin:0; font-size:.85rem}

@media (min-width:820px){
  section{padding:4.5rem 0}
  .featured{grid-template-columns:1.15fr 1fr; align-items:center}
  .featured-media{height:100%; aspect-ratio:auto; min-height:340px}
  .featured-body{padding:2.5rem 2.75rem}
}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  .visor span{animation:none; opacity:1}
  .card{transition:none}
  .card:hover, .card:focus-within{transform:none}
}
/* hero pop: calm glow using the game pages' breathe timing (6.2s, like the logo breathe) */
.hero .wrap{position:relative; isolation:isolate}
.hero .wrap::before{content:""; position:absolute; left:50%; top:46%; width:min(820px,120%); aspect-ratio:1.6; transform:translate(-50%,-50%); z-index:-1; pointer-events:none;
  background:radial-gradient(ellipse at 38% 50%, rgba(255,45,155,.16), transparent 60%), radial-gradient(ellipse at 62% 50%, rgba(34,228,245,.13), transparent 62%);
  filter:blur(24px); animation:heroGlow 6.2s cubic-bezier(.45,0,.55,1) infinite}
@keyframes heroGlow{0%,100%{opacity:.75}50%{opacity:1}}
.hero h1{animation:titleGlow 6.2s cubic-bezier(.45,0,.55,1) infinite}
@keyframes titleGlow{
  0%,100%{text-shadow:-2px 0 rgba(255,45,155,.85), 2px 0 rgba(34,228,245,.85), 0 0 18px rgba(255,45,155,.55), 0 0 40px rgba(34,228,245,.2)}
  50%{text-shadow:-2px 0 rgba(255,45,155,.95), 2px 0 rgba(34,228,245,.95), 0 0 26px rgba(255,45,155,.75), 0 0 60px rgba(34,228,245,.38)}
}
.hero .mcp-btn{font-size:1.15rem; padding:.75rem 2rem}

/* scroll cue: a slow bobbing chevron down to the games */
.scroll-cue{display:inline-flex; flex-direction:column; align-items:center; gap:.35rem; margin-top:2.25rem; padding:.4rem .8rem; border-radius:12px;
  color:var(--cyan); text-decoration:none; font-family:"JetBrains Mono",ui-monospace,monospace; font-size:.78rem; letter-spacing:.12em; text-transform:uppercase}
.scroll-cue span{color:#BFD0EE; transition:color .2s}
.scroll-cue:hover span{color:var(--ink)}
.scroll-cue svg{width:34px; height:74px; fill:none; stroke:currentColor; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; overflow:visible;
  filter:drop-shadow(0 0 6px rgba(34,228,245,.8)) drop-shadow(0 0 14px rgba(255,45,155,.45))}
/* waterfall: five chevrons light up and fade one after another, top to bottom, 0.4s apart */
.scroll-cue path{opacity:.15; animation:cueFall 2.6s ease-in-out infinite}
.scroll-cue path:nth-child(1){animation-delay:-2.6s}
.scroll-cue path:nth-child(2){animation-delay:-2.2s}
.scroll-cue path:nth-child(3){animation-delay:-1.8s}
.scroll-cue path:nth-child(4){animation-delay:-1.4s}
.scroll-cue path:nth-child(5){animation-delay:-1s}
@keyframes cueFall{0%,100%{opacity:.15; transform:translateY(-2px)}20%{opacity:1; transform:translateY(0)}50%{opacity:.15; transform:translateY(2px)}}

/* hero placement: full first screen, more room at the top, spacing that tightens on short screens so the arrow stays in view */
.hero{min-height:100vh; min-height:100svh; align-content:center;
  padding:calc(clamp(4.5rem, 13vh, 8rem) + env(safe-area-inset-top, 0px)) 0 clamp(1.25rem, 4vh, 3rem)}
.hero h1{font-size:min(clamp(3rem,13vw,7rem), 14vh)}
.visor{margin-bottom:clamp(1rem, 3.5vh, 2rem)}
.mint-wrap{margin-top:clamp(1.25rem, 4vh, 2.25rem)}
.scroll-cue{margin-top:clamp(.75rem, 3.5vh, 2.25rem)}
/* nudge the hero block up a tad (between the home4 and home5 placement) */
.hero .wrap{top:calc(-1 * clamp(.75rem, 3.5vh, 2rem))}
@media (max-height:640px){.tagline{margin-top:.75rem} .mint-note{margin-top:.6rem} .scroll-cue{gap:.2rem} .scroll-cue svg{width:29px; height:63px} .hero{padding-bottom:.75rem}}

/* gold outline on the title: the mint button gold, with a slow soft glare sweeping across it */
.hero h1{position:relative; -webkit-text-stroke:3px #FFC93C; paint-order:stroke fill}
.hero h1::after{content:attr(data-text); content:attr(data-text) / ""; position:absolute; inset:0; pointer-events:none; text-shadow:none;
  color:transparent; -webkit-text-stroke:3px #FFF1BF; paint-order:stroke fill; filter:drop-shadow(0 0 2px rgba(255,214,110,.6));
  -webkit-mask-image:linear-gradient(105deg, transparent 42%, #000 50%, transparent 58%); mask-image:linear-gradient(105deg, transparent 42%, #000 50%, transparent 58%);
  -webkit-mask-size:300% 100%; mask-size:300% 100%; -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
  -webkit-mask-position:100% 0; mask-position:100% 0; animation:titleGlare 6.5s cubic-bezier(.45,0,.55,1) infinite}
@keyframes titleGlare{0%{-webkit-mask-position:100% 0; mask-position:100% 0}62%,100%{-webkit-mask-position:0 0; mask-position:0 0}}
@supports not ((-webkit-mask-image:linear-gradient(#000,#000)) or (mask-image:linear-gradient(#000,#000))){.hero h1::after{display:none}}
@supports not (-webkit-text-stroke:1px #000){.hero h1::after{display:none}}

/* hero bot: a short neck and two hands gripping the title tops (sized in the title's em so they scale with it), eyes that look around and blink */
.hero h1 .bot-rig{position:absolute; left:50%; top:0; width:0; height:0; pointer-events:none}
.hero h1 .bot-neck{position:absolute; z-index:-1; width:clamp(14px, .19em, 21px); left:calc(clamp(14px, .19em, 21px) / -2 + 0.195em); top:calc(-1 * clamp(1rem, 3.5vh, 2rem) - 1px); height:14px;
  box-sizing:border-box; border:1px solid rgba(34,228,245,.42); border-top:0; border-radius:0 0 7px 7px;
  background:linear-gradient(180deg, transparent 6px, rgba(34,228,245,.28) 6px, rgba(34,228,245,.28) 7px, transparent 7px),
    linear-gradient(90deg, #050913, #11203A 50%, #050913);
  box-shadow:inset 0 0 8px rgba(34,228,245,.14), 0 0 10px rgba(34,228,245,.18);
  -webkit-mask-image:linear-gradient(180deg, #000 8px, transparent); mask-image:linear-gradient(180deg, #000 8px, transparent)}
.hero h1 .bot-hands{position:absolute; left:-1.3em; top:0; width:2.6em; height:.32em; overflow:visible;
  stroke:rgba(34,228,245,.62); stroke-width:1.2px; filter:drop-shadow(0 0 .035em rgba(34,228,245,.45))}
.hero h1 .bot-hands *{vector-effect:non-scaling-stroke}
.hero h1 .bot-hands-b{z-index:-1}
.hero h1 .bot-hands-f{z-index:2}
.hero h1 .bot-plate{fill:none; stroke:rgba(34,228,245,.3); stroke-linecap:round}
.hero h1 .bot-joint{fill:none; stroke:rgba(34,228,245,.4); stroke-linecap:round}
.visor span{animation:eye 4s ease-in-out infinite, eyeLook 11s cubic-bezier(.45,0,.3,1) infinite, eyeBlink 7.7s ease-in-out infinite}
@keyframes eyeLook{
  0%,10%{translate:0 0} 14%,30%{translate:calc(-6px * var(--idle)) 0} 34%,40%{translate:0 0} 44%,58%{translate:calc(6px * var(--idle)) calc(-2px * var(--idle))}
  62%,66%{translate:0 0} 70%,80%{translate:calc(-3px * var(--idle)) calc(3px * var(--idle))} 84%,88%{translate:calc(2px * var(--idle)) calc(-3px * var(--idle))} 92%,100%{translate:0 0}}
@keyframes eyeBlink{
  0%,30%,31.7%,80%,81.6%,83.2%,100%{scale:1 1} 30.85%,80.8%,82.4%{scale:1.1 .12}}
.visor{position:relative; left:calc(min(clamp(3rem,13vw,7rem), 14vh) * 0.195)}
/* watch: head turns toward a press, then returns */
@property --idle{syntax:'<number>'; inherits:true; initial-value:1}
.hero .wrap{--idle:1; --htx:0px; --hry:0deg; --hrx:0deg; --hrz:0deg; --hex:0px; --hey:0px}
.visor{transform-origin:50% 100%; transform:perspective(170px) rotateX(var(--hrx)) rotateY(var(--hry)) rotate(var(--hrz)); translate:var(--htx) 0;
  transition:transform .42s cubic-bezier(.3,.6,.3,1), translate .42s cubic-bezier(.3,.6,.3,1)}
.hero h1 .bot-neck{translate:var(--htx) 0; transition:translate .42s cubic-bezier(.3,.6,.3,1)}
.visor span{transform:translate(var(--hex), var(--hey)); transition:transform .42s cubic-bezier(.3,.6,.3,1)}
.hero .wrap.watching{--idle:0}
.hero .wrap{transition:--idle .42s ease}
.hero .wrap.watching .visor, .hero .wrap.watching .visor span, .hero .wrap.watching .bot-neck{transition-duration:.34s}
.hero .wrap.following, .hero .wrap.following .visor, .hero .wrap.following .visor span, .hero .wrap.following .bot-neck{transition:none}

<script>
(function(){
  /* ---------- background: bots + network ---------- */
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const IMGS = {};
  const ids = ['414','22','429','440'];
  const botsEl = document.getElementById('bots');
  const canvas = document.getElementById('net'), ctx = canvas.getContext('2d');
  let W = 0, H = 0, dpr = 1, bots = [], nodes = [], packets = [];

  function makeBots(){
    botsEl.innerHTML = ''; bots = [];
    const small = W < 720;
    const count = 0;
    for (let i = 0; i < count; i++){
      const id = ids[i % ids.length];
      const size = small ? 78 + Math.random()*16 : 104 + Math.random()*40;
      const el = document.createElement('div'); el.className = 'bot'; el.style.width = size + 'px';
      el.innerHTML = '<img alt="" src="' + IMGS[id] + '"><div class="tag"><b>#' + id + '</b><span>0x' + hex(3) + '</span></div>';
      if (small) el.querySelector('.tag span').remove();
      botsEl.appendChild(el);
      const sp = 0.15 + Math.random()*0.25, a = Math.random()*Math.PI*2;
      bots.push({ el, w:size, h:size + 26, x:Math.random()*(W - size), y:Math.random()*(H - size - 26),
        vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, r:(Math.random()-.5)*14, vr:(Math.random()-.5)*0.04, ph:Math.random()*6 });
    }
  }
  function makeNodes(){
    nodes = [];
    const n = Math.round(W * H / 26000);
    for (let i = 0; i < n; i++) nodes.push({ x:Math.random()*W, y:Math.random()*H, vx:(Math.random()-.5)*.2, vy:(Math.random()-.5)*.2 });
  }
  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    makeBots(); makeNodes(); packets = [];
  }
  const center = b => ({ x:b.x + b.w/2, y:b.y + b.h/2 });

  function step(){
    for (const b of bots){
      b.x += b.vx; b.y += b.vy; b.r += b.vr; b.ph += 0.01;
      if (b.x < -b.w*0.3 || b.x > W - b.w*0.7) b.vx *= -1;
      if (b.y < -b.h*0.3 || b.y > H - b.h*0.7) b.vy *= -1;
      if (Math.abs(b.r) > 10) b.vr *= -1;
    }
    for (const n of nodes){
      n.x += n.vx; n.y += n.vy;
      if (n.x < 0 || n.x > W) n.vx *= -1;
      if (n.y < 0 || n.y > H) n.vy *= -1;
    }
    // spawn bit packets along the node mesh
    if (nodes.length > 1 && Math.random() < 0.08){
      const a = nodes[Math.random()*nodes.length|0];
      const near = nodes.filter(n => n !== a && Math.hypot(n.x-a.x, n.y-a.y) < 130);
      if (near.length) packets.push({ a, b:near[Math.random()*near.length|0], t:0, bit:Math.random() < .5 ? '0' : '1', s:0.01 + Math.random()*0.01 });
    }
    packets = packets.filter(p => (p.t += p.s) < 1);
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    // node mesh
    const LINK = 130;
    for (let i = 0; i < nodes.length; i++){
      const a = nodes[i];
      for (let j = i+1; j < nodes.length; j++){
        const b = nodes[j], d = Math.hypot(a.x-b.x, a.y-b.y);
        if (d < LINK){ ctx.strokeStyle = 'rgba(34,228,245,' + (0.16*(1-d/LINK)) + ')'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
      }
      ctx.fillStyle = 'rgba(34,228,245,.45)'; ctx.fillRect(a.x-1.5, a.y-1.5, 3, 3);
    }
    // bot links
    const reach = Math.max(420, W*0.4);
    for (let i = 0; i < bots.length; i++){
      for (let j = i+1; j < bots.length; j++){
        const a = center(bots[i]), b = center(bots[j]), d = Math.hypot(a.x-b.x, a.y-b.y);
        if (d < reach){
          ctx.strokeStyle = 'rgba(255,45,155,' + (0.22*(1-d/reach)) + ')'; ctx.lineWidth = 1.2;
          ctx.setLineDash([4,6]); ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); ctx.setLineDash([]);
        }
      }
    }
    // packets carrying bits
    ctx.font = '600 13px "JetBrains Mono", ui-monospace, monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const p of packets){
      const a = p.a, b = p.b;
      const x = a.x + (b.x-a.x)*p.t, y = a.y + (b.y-a.y)*p.t;
      const alpha = Math.sin(p.t*Math.PI);
      ctx.shadowColor = p.bit === '1' ? '#22E4F5' : '#FF2D9B'; ctx.shadowBlur = 12;
      ctx.fillStyle = (p.bit === '1' ? 'rgba(34,228,245,' : 'rgba(255,45,155,') + alpha + ')';
      ctx.fillText(p.bit, x, y); ctx.shadowBlur = 0;
    }
    // place bot cards
    for (const b of bots){
      const bob = Math.sin(b.ph) * 6;
      b.el.style.transform = 'translate(' + b.x + 'px,' + (b.y + bob) + 'px) rotate(' + b.r + 'deg)';
    }
  }
  function loop(){ step(); draw(); requestAnimationFrame(loop); }

  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { resize(); if (reduce) draw(); }, 150); });
  resize();
  if (reduce) draw(); else loop();
})();
</script>

  }

    set('--hrz',cur.rz.toFixed(2)+'deg'); set('--hex',cur.ex.toFixed(2)+'px'); set('--hey',cur.ey.toFixed(2)+'px'); set('--idle',cur.idle.toFixed(3));
  }
